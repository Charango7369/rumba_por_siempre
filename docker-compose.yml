version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rumba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: rumba_db
    ports:
      - "5432:5432"
    volumes:
      - rumba_postgres_data:/var/lib/postgresql/data

volumes:
  rumba_postgres_data: